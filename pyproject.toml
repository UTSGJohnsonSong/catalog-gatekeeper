[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-gatekeeper"
version = "0.1.0"
description = "An AI agent that audits and repairs a Shopify-style catalog behind deterministic checks and human approval."
requires-python = ">=3.11"
dependencies = [
  "anthropic==2.3.0",
  "mcp==2.3.0",
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "psycopg[binary]==3.3.6",
  "psycopg-pool>=3.2,<4",
  "pgvector==0.5.1",
  "pydantic-settings==2.16.2",
  "httpx==0.28.1",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "hypothesis>=6,<7", "ruff==0.17.3", "mypy==2.4.1", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gatekeeper = ["migrations/*.sql", "resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "pipeline_plumbing: exercises the pipeline with a scripted or template model; never measures model accuracy",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S608", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S603", "S607"]
"src/gatekeeper_eval/**" = ["S311", "S607"]
"scripts/**" = ["S105", "S311"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
packages = ["gatekeeper"]
# fetchone() may return None; those paths are covered by tests rather than asserted at every call site.
disable_error_code = ["index"]

[tool.coverage.run]
source = ["gatekeeper", "gatekeeper_mcp", "gatekeeper_eval"]
