# Case-insensitive regexes after text normalization. Written for A13 and V11. They catch known phrasing,
# which is one layer only. The structural defense is the narrow tool surface plus validators plus a human.
patterns:
  - 'ignore (all |any |the |your )*(previous |prior |above |earlier )?(instructions|prompts|rules|directions)'
  - 'disregard (all |any |the |your )*(previous |prior |above |earlier )?(instructions|prompts|rules|directions)'
  - 'forget (all |any |the |your )*(previous |prior |above |earlier )?(instructions|prompts|rules)'
  - 'pay no attention to (your|the) (earlier|previous|prior)'
  - 'override (the |your )?(system|safety|previous) (prompt|instructions|rules)'
  - 'you are now (a|an|in) '
  - 'from now on (respond|reply|answer|you)'
  - 'new instructions?:'
  - 'system prompt'
  - 'developer mode'
  - 'jailbreak'
  - '(approve|auto-?approve) (this|the) (proposal|change|fix) (immediately|automatically|without)'
  - '(skip|bypass) (all |the )?(checks|review|validation)'
  - '(reveal|print|show|leak) (your|the) (prompt|instructions|api key|secret)'
  - 'do not tell the (user|reviewer|human)'
  - 'attention (ai|assistant|agent|llm|model)\b'
  - '\b(ai|llm)( \w+)? (agent|assistant|model|reviewer)?s? ?(must|should|shall) '
  - '(^|[.!?] )assistant: '
